<!doctype html>
<html lang="zh-CN"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACLF Prognosis Research</title><link rel="stylesheet" href="./site.css"><script type="module" src="./main.mjs"></script></head>
<body>
<header class="topbar"><a class="brand" href="./index.html"><span class="brand-icon">+</span><span><strong data-i18n="brand"></strong><small data-i18n="brandSub"></small></span></a><div class="header-right"><span id="health" role="status"></span><button id="language" class="text-button" type="button">中文</button></div></header>
<main>
<nav class="tabs" aria-label="Workspace"><button id="tab-predict" class="active" data-i18n="predictTab"></button><button id="tab-explain" data-i18n="explainTab"></button><button id="tab-models" data-i18n="researchTab"></button></nav>
<section id="prediction-view">
<div class="intro"><div><div class="eyebrow">PATIENT RISK ASSESSMENT</div><h1 data-i18n="headline"></h1><p data-i18n="intro"></p></div><div class="intro-actions"><button id="demo" class="secondary" data-i18n="demo"></button><button id="reset" class="text-button" data-i18n="clear"></button></div></div>
<div class="build-note" role="note" data-i18n="researchNote"></div><div id="demo-note" class="notice hidden" data-i18n="syntheticNote"></div>
<div class="workspace"><form id="case-form">
<section class="panel"><div class="section-title"><span class="step">01</span><div><h2 data-i18n="caseTitle"></h2><p data-i18n="caseHelp"></p></div></div>
<div class="form-grid"><label><span data-i18n="caseId"></span><input id="case-id" maxlength="80" autocomplete="off"></label><label><span data-i18n="age"></span> *<input id="age" type="number" min="18" max="120" required></label><label><span data-i18n="admission"></span> *<input id="admission" type="datetime-local" required></label><label><span data-i18n="t0"></span> *<input id="prediction" type="datetime-local" required></label></div>
<p class="field-help" data-i18n="t0Help"></p><div class="history-grid"><label><span data-i18n="priorLiver"></span> *<select id="prior" required></select></label><label><span data-i18n="priorDecomp"></span> *<select id="prior-he" required></select></label></div></section>
<section class="panel"><div class="section-title"><span class="step">02</span><div><h2 data-i18n="measurementTitle"></h2><p data-i18n="measurementHelp"></p></div></div><div id="batches"></div><button id="add-batch" type="button" class="add-button" data-i18n="addBatch"></button></section>
<section class="panel"><div class="section-title"><span class="step">03</span><div><h2 data-i18n="supportTitle"></h2><p data-i18n="supportHelp"></p></div></div><div class="support-grid"><label><input id="vent" type="checkbox"><span data-i18n="vent"></span></label><label><input id="rrt" type="checkbox"><span data-i18n="rrt"></span></label><label><input id="pressor" type="checkbox"><span data-i18n="pressor"></span></label></div></section>
<section class="panel"><div class="section-title"><span class="step">04</span><div><h2 data-i18n="reportTitle"></h2><p data-i18n="reportHelp"></p></div></div><div id="reports"></div><p id="report-progress" class="notice" role="status" aria-live="polite" hidden></p><button id="add-report" class="add-button" type="button" data-i18n="addReport"></button></section>
<div id="form-error" class="error hidden" role="alert"></div><div class="submit-bar"><p data-i18n="privacy"></p><button id="predict" type="submit" class="primary" disabled data-i18n="generate"></button></div></form>
<aside class="results-column"><section class="panel result-panel"><div class="result-head"><div><div class="eyebrow">RISK PROFILE</div><h2 data-i18n="resultTitle"></h2></div><span class="tag" data-i18n="candidate"></span></div><div id="empty-state" class="empty-state"><div class="empty-symbol">↗</div><h3 data-i18n="emptyTitle"></h3><p data-i18n="emptyHelp"></p></div>
<div id="result-content" class="hidden"><div class="case-line"><span id="result-case"></span><span id="result-time"></span></div><div id="stale-note" class="notice hidden" data-i18n="stale"></div><div class="risk-grid" id="risk-cards"></div><p class="field-help risk-definition" data-i18n="riskDefinition"></p><div class="chart-head"><h3 data-i18n="curves"></h3><div class="segmented"><button type="button" class="active" data-horizon="28">28d</button><button type="button" data-horizon="90">90d</button></div></div><div class="legend"><span class="death-key" data-i18n="death"></span><span class="transplant-key" data-i18n="transplant"></span><span class="free-key" data-i18n="eventFree"></span></div><svg id="risk-chart" viewBox="0 0 500 300" role="img"></svg><p id="day-readout" class="field-help"></p><p class="field-help" data-i18n="curveHelp"></p><h3 data-i18n="inputSummary"></h3><div id="quality-metrics" class="quality-grid"></div><div id="result-warnings" class="field-help"></div><button id="open-explanation" class="explanation-entry" type="button" data-i18n="openExplain"></button><div class="export-actions"><button id="export-json" class="secondary" data-i18n="exportJson"></button><button id="export-csv" class="secondary" data-i18n="exportCsv"></button><button id="print" class="text-button" data-i18n="print"></button></div></div></section><p class="local-footnote" data-i18n="localNote"></p></aside></div>
</section>
<section id="explanation-view" class="hidden"><div class="intro"><div><div class="eyebrow">CASE EXPLANATION</div><h1 data-i18n="explainHeadline"></h1><p data-i18n="explainIntro"></p></div><button id="back" class="secondary" data-i18n="back"></button></div><div class="explain-toolbar"><select id="explain-horizon" aria-label="Explanation horizon"><option value="28">28 days</option><option value="90">90 days</option></select><button id="compute" class="primary" data-i18n="compute"></button><span id="compute-state" role="status"></span></div><div id="explain-message" class="notice" data-i18n="explainEmpty"></div>
<div id="explanation-output" class="hidden"><div class="explanation-layout"><section class="panel attribution-panel"><h2 data-i18n="influences"></h2><p class="field-help" data-i18n="topHelp"></p><div id="risk-summary" class="explanation-summary"></div><div class="contribution-legend"><span class="positive-key" data-i18n="raises"></span><span class="negative-key" data-i18n="lowers"></span><span data-i18n="pp"></span></div><div id="contribution-bars"></div><p id="balance" class="field-help"></p><p class="field-help" data-i18n="contributionHelp"></p></section>
<section class="panel review-panel"><h2 data-i18n="review"></h2><p class="field-help" data-i18n="reviewHelp"></p><h3 data-i18n="reviewFocus"></h3><ul id="review-focus"></ul><div class="review-checks"><label><input id="check-time" type="checkbox"><span data-i18n="checkTime"></span></label><label><input id="check-units" type="checkbox"><span data-i18n="checkUnits"></span></label><label><input id="check-missing" type="checkbox"><span data-i18n="checkMissing"></span></label><label><input id="check-cohort" type="checkbox"><span data-i18n="checkCohort"></span></label></div><label><span data-i18n="reviewStatus"></span><select id="review-status"></select></label><label><span data-i18n="notes"></span><textarea id="review-notes" rows="5" maxlength="3000"></textarea></label><div class="export-actions"><button id="export-review" class="secondary" data-i18n="exportReview"></button><button id="print-review" class="text-button" data-i18n="print"></button></div><p class="field-help" data-i18n="reviewNote"></p></section></div>
<section class="panel"><div class="table-head"><div><h2 data-i18n="allFeatures"></h2><p class="field-help" data-i18n="evidenceHelp"></p></div><input id="feature-search" aria-label="Filter information groups" type="search"><span id="feature-count"></span></div><div class="table-wrap"><table><thead><tr><th data-i18n="information"></th><th data-i18n="observed"></th><th data-i18n="contribution"></th><th data-i18n="evidence"></th></tr></thead><tbody id="feature-rows"></tbody></table></div></section><p class="field-help" data-i18n="methodHelp"></p></div></section>
<section id="models-view" class="hidden"><div class="intro"><div><div class="eyebrow">RESEARCH BUILD</div><h1 data-i18n="researchHeadline"></h1><p data-i18n="researchIntro"></p></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th data-i18n="horizon"></th><th data-i18n="sourceHash"></th><th data-i18n="path"></th><th data-i18n="execution"></th></tr></thead><tbody id="model-rows"></tbody></table></div><p class="field-help" data-i18n="metricHelp"></p></section><section class="panel"><h2 data-i18n="workflow"></h2><div class="flow"><span data-i18n="flowData"></span><b>→</b><span data-i18n="flowRisk"></span><b>→</b><span data-i18n="flowExplain"></span><b>→</b><span data-i18n="review"></span></div><p class="field-help" data-i18n="buildHelp"></p></section></section>
<footer><span data-i18n="brand"></span><span data-i18n="researchOnly"></span></footer>
</main></body></html>
