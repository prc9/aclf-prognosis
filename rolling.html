<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>ACLF Prognosis Research</title><link rel="stylesheet" href="./site.css"><link rel="stylesheet" href="./rolling.css"><script type="module" src="./rolling-ui.mjs"></script></head>
<body><header class="topbar"><a class="brand" href="./index.html"><span class="brand-icon">+</span><span><strong data-t="brand"></strong><small data-t="subtitle"></small></span></a><div class="header-right"><span id="health" role="status" data-t="loading"></span><button id="guide" class="secondary" data-t="guide"></button><button id="language" class="text-button">中文</button></div></header>
<main><nav class="tabs"><button id="predict-tab" class="active" data-t="prediction"></button><button id="evidence-tab" data-t="evidenceTab"></button><button id="metrics" data-t="metrics"></button><a id="legacy-link" href="./baseline.html" data-t="legacy"></a></nav>
<div class="intro"><div><div class="eyebrow">DAILY UPDATED PROGNOSIS</div><h1 data-t="headline"></h1><p data-t="intro"></p></div><div class="intro-actions"><button id="demo" class="secondary" data-t="demo"></button><button id="demo-report" class="secondary" data-t="demoReport"></button><button id="import" class="secondary" data-t="import"></button><input id="import-file" type="file" accept=".json,application/json" hidden><button id="clear" class="text-button" data-t="clear"></button></div></div>
<div class="build-note" data-t="buildNote"></div><div id="demo-note" class="notice" hidden data-t="demoNote"></div><div id="error" class="error" role="alert" hidden></div>
<section id="predict-view"><div class="workspace"><form id="rolling-form">
<section class="panel"><div class="section-title"><span class="step">01</span><div><h2 data-t="caseTitle"></h2><p data-t="caseHelp"></p></div></div><div class="form-grid">
<label><span data-t="caseId"></span><input id="case-id" maxlength="80" autocomplete="off"></label><label><span data-t="age"></span> *<input id="age" type="number" min="18" max="120" required></label>
<label><span data-t="admission"></span> *<input id="admission" type="datetime-local" step="1" required></label><label><span data-t="t0"></span> *<input id="baseline" type="datetime-local" step="1" required></label>
<label><span data-t="prior"></span> *<select id="prior" required></select></label><label><span data-t="decomp"></span> *<select id="decomp" required></select></label></div><p class="field-help" data-t="t0Help"></p>
<div class="assessment-box"><label><span data-t="assessment"></span> *<input id="assessment" type="datetime-local" step="1" required></label><div class="day-shortcuts"><button type="button" data-day="0">T0</button><button type="button" data-day="3">D3</button><button type="button" data-day="7">D7</button><button type="button" data-day="14">D14</button><button type="button" data-day="21">D21</button><button type="button" data-day="28">D28</button></div><p id="day-label" class="field-help"></p></div>
<div class="review-checks"><label><input id="alive" type="checkbox" required><span data-t="alive"></span></label><label><input id="no-lt" type="checkbox" required><span data-t="noLt"></span></label><label><input id="inpatient" type="checkbox" required><span data-t="inpatient"></span></label></div></section>
<section class="panel"><div class="section-title"><span class="step">02</span><div><h2 data-t="measurementTitle"></h2><p data-t="measurementHelp"></p></div></div><div id="batches"></div><button id="add-batch" type="button" class="add-button" data-t="addBatch"></button></section>
<section class="panel"><div class="section-title"><span class="step">03</span><div><h2 data-t="supportTitle"></h2><p data-t="supportHelp"></p></div></div><div id="supports"></div><button id="add-support" type="button" class="add-button" data-t="addSupport"></button></section>
<section class="panel"><div class="section-title"><span class="step">04</span><div><h2 data-t="reportTitle"></h2><p data-t="reportHelp"></p></div></div><div id="reports"></div><button id="add-report" type="button" class="add-button" data-t="addReport"></button></section>
<div class="submit-bar"><p data-t="privacy"></p><button id="predict" type="submit" class="primary" disabled data-t="generate"></button></div></form>
<aside class="results-column"><section class="panel"><div class="result-head"><div><div class="eyebrow">CURRENT ASSESSMENT</div><h2 data-t="riskTitle"></h2></div><span id="scope" class="tag" data-t="research"></span></div><div id="empty" class="empty-state"><div class="empty-symbol">↗</div><h3 data-t="empty"></h3><p data-t="emptyHelp"></p></div>
<div id="results" hidden><div id="result-time" class="case-line"></div><p class="risk-definition field-help" data-t="riskDefinition"></p><div id="risk-cards" class="risk-grid"></div><div class="chart-head"><h3 data-t="curves"></h3><select id="curve-horizon"><option value="28">28 days</option><option value="90">90 days</option></select></div><div class="legend"><span class="death-key" data-t="death"></span><span class="transplant-key" data-t="transplant"></span><span class="free-key" data-t="free"></span></div><svg id="rolling-chart" viewBox="0 0 500 300" role="img"></svg><p class="field-help" data-t="curveHelp"></p><div id="coverage" class="quality-grid"></div><p id="warnings" class="notice" hidden></p><button id="open-evidence" type="button" class="explanation-entry" data-t="openEvidence"></button><div class="export-actions"><button id="export" class="secondary" data-t="export"></button><button id="csv" class="secondary" data-t="csv"></button><button id="print" class="text-button" data-t="print"></button></div><p id="model-id" class="field-help model-id"></p></div></section>
<section class="panel"><div class="chart-head"><h2 data-t="historyTitle"></h2><button id="daily" class="secondary" disabled data-t="daily"></button></div><p class="field-help" data-t="historyHelp"></p><svg id="history-chart" viewBox="0 0 500 270" role="img" hidden></svg><div class="table-wrap"><table><thead><tr><th data-t="day"></th><th data-t="assessment"></th><th data-t="future28"></th><th data-t="future90"></th><th data-t="scope"></th></tr></thead><tbody id="history-rows"></tbody></table></div></section>
</aside></div></section>
<section id="evidence-view" hidden><div class="explanation-layout"><section class="panel"><h2 data-t="evidenceTitle"></h2><p data-t="explainHelp" class="field-help"></p><div id="report-effect" class="explanation-summary"></div><div id="evidence-summary" class="build-note"></div><div class="table-wrap"><table><thead><tr><th data-t="indicator"></th><th data-t="value"></th><th data-t="measured"></th><th data-t="available"></th></tr></thead><tbody id="evidence-rows"></tbody></table></div><h3 data-t="usedReports"></h3><div id="report-evidence"></div></section>
<section class="panel review-panel"><h2 data-t="review"></h2><p class="field-help" data-t="reviewHelp"></p><div class="review-checks"><label><input id="check-time" type="checkbox"><span data-t="checkTime"></span></label><label><input id="check-units" type="checkbox"><span data-t="checkUnits"></span></label><label><input id="check-status" type="checkbox"><span data-t="checkStatus"></span></label></div><label><span data-t="reviewStatus"></span><select id="review-status"></select></label><label><span data-t="notes"></span><textarea id="review-notes" rows="6" maxlength="3000"></textarea></label><p class="field-help" data-t="reviewNote"></p><button id="export-review" class="secondary" data-t="export"></button></section></div></section>
<div id="progress" class="notice" role="status" aria-live="polite" hidden></div><footer><span data-t="brand"></span><span data-t="research"></span></footer></main>
<dialog id="guide-dialog"><div class="guide-head"><h2 data-t="guide"></h2><button id="close-guide" class="secondary" data-t="close"></button></div><div id="guide-content"></div><button id="guide-demo" class="primary" data-t="guideDemo"></button></dialog>
<dialog id="metrics-dialog"><div class="guide-head"><h2 data-t="metrics"></h2><button id="close-metrics" class="secondary" data-t="close"></button></div><p data-t="metricsHelp"></p><div id="metrics-content"></div></dialog>
</body></html>
